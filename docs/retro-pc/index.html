<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202731">
<meta name="description" content="Turn on the PC and explore my portfolio.">
<title>Andrés Landazábal · Retro PC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23202731'/%3E%3Cpath d='M7 7h18v14H7zM11 25h10M16 21v4' fill='none' stroke='%23b8cce2' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<main aria-label="Interactive portfolio">
<div class="viewer" id="viewer">
<div class="screen-toolbar" id="screen-toolbar" hidden>
<button id="back-to-pc" type="button" title="Return to the computer (Esc)">&#8592; Back</button>
</div>
<div id="desktop-announcement" class="sr-only" role="status" aria-live="polite"></div>
<div class="stage" id="stage"></div>
<div class="loading" id="loading" role="status"><span class="load-line"></span><span class="sr-only">Loading computer</span></div>
</div>
<div class="intro-prompt">
<button id="enter-screen" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m-5-7a8 8 0 1 0 10 0"/></svg><span>Turn on the PC and explore my portfolio.</span></button>
</div>
</main>
<dialog id="portfolio-window" aria-labelledby="portfolio-title">
  <header class="portfolio-titlebar">
    <h1 id="portfolio-title">▤ portafolio — Andrés Landazábal</h1>
    <div class="portfolio-actions">
      <button id="minimize-portfolio" type="button" aria-label="Minimize portfolio" title="Minimize"><span aria-hidden="true">_</span></button>
      <button id="maximize-portfolio" type="button" aria-label="Maximize portfolio" title="Maximize" aria-pressed="false"><span aria-hidden="true">□</span></button>
      <button id="close-portfolio" type="button" aria-label="Close portfolio and return to desktop" title="Close" autofocus><span aria-hidden="true">×</span></button>
    </div>
  </header>
  <iframe id="portfolio-content" title="Andrés Landazábal’s portfolio"></iframe>
</dialog>
<dialog id="shutdown-window" aria-labelledby="shutdown-title" aria-describedby="shutdown-description">
  <header class="shutdown-titlebar"><h2 id="shutdown-title">Shut Down Windows</h2><button id="shutdown-close" type="button" aria-label="Cancel shutdown">×</button></header>
  <div class="shutdown-banner"><span class="shutdown-flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Microsoft<br><strong>Windows <b>2000</b></strong><small>Professional</small></span></div>
  <form id="shutdown-form">
    <label for="shutdown-action">What do you want the computer to do?</label>
    <select id="shutdown-action" autofocus><option value="shutdown">Shut down</option><option value="restart">Restart</option></select>
    <p id="shutdown-description">Closes the desktop and turns off the computer.</p>
    <p id="shutdown-help" hidden>Select Shut down to turn off the PC, or Restart to start the desktop again. Cancel returns to your desktop.</p>
    <p id="shutdown-status" role="status" hidden></p>
    <div class="shutdown-actions"><button id="shutdown-ok" type="submit">OK</button><button id="shutdown-cancel" type="button">Cancel</button><button id="shutdown-help-button" type="button" aria-expanded="false" aria-controls="shutdown-help">Help</button></div>
  </form>
</dialog>
<script type="module" src="./viewer.js"></script>
</body></html>
